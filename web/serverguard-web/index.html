<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ServerGuard</title>

<!--
    ============================================================
    ЭТО ТОЛЬКО КАРКАС СТРАНИЦЫ.

    Разметка каждого модуля (SSH Key Guard, Security, Telegram Bot,
    SSH Hardening и любых новых) НЕ хранится здесь — она подгружается
    во время выполнения из modules/<id>/index.html, modules/<id>/style.css
    и modules/<id>/script.js. См. core/core.js — там же список модулей
    (MODULE_MANIFEST) и вся логика загрузки/переключения вкладок.

    Чтобы добавить новый модуль, править этот файл НЕ нужно — только
    core/core.js (одна строка в MODULE_MANIFEST) и создать папку
    modules/<новый_id>/.
    ============================================================
-->

<link rel="stylesheet" href="core/core.css">

</head>
<body>


<!-- ============================================================
     SIDEBAR
     ============================================================ -->

<aside>

    <div class="brand">
        ServerGuard
    </div>

    <div class="conn">

        <span class="dot" id="connDot"></span>

        <span id="connText">
            проверка…
        </span>

    </div>

    <!-- Кнопки модулей рендерятся сюда из core/core.js -->
    <nav id="nav"></nav>

</aside>


<!-- ============================================================
     MAIN
     ============================================================ -->

<main id="main">

    <div class="banner" id="banner"></div>

    <!--
        Секции модулей (<section data-module="...">...</section>)
        добавляются сюда во время выполнения core/core.js.
    -->

</main>


<!-- ============================================================
     CONFIRM DIALOG (общий для всех модулей)
     ============================================================ -->

<dialog id="dlg">

    <b id="dlgTitle"></b>

    <p id="dlgText"></p>

    <div class="row">

        <button id="dlgNo">
            Отмена
        </button>

        <button class="go" id="dlgYes">
            Подтвердить
        </button>

    </div>

</dialog>


<script src="core/core.js"></script>

</body>
</html>
