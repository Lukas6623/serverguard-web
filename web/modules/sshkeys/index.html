<!-- ============================================================
     MODULE: SSH KEY GUARD

     Открыт по умолчанию (без hidden), т.к. это первый модуль
     в MODULE_MANIFEST (core/core.js).
     ============================================================ -->

<section id="view-sshkeys" data-module="sshkeys">

    <header class="top">

        <div>

            <h1>
                SSH Key Guard
            </h1>

            <div class="sub">
                Отслеживает изменения в authorized_keys на сервере
            </div>

        </div>

        <div class="tools">

            <span class="spin" id="spin"></span>

            <label>

                <input type="checkbox" id="auto" checked>

                обновлять статус (15 с)

            </label>

            <button class="btn" id="refreshBtn" style="padding:6px 12px">
                Обновить
            </button>

        </div>

    </header>


    <div class="grid" id="stats"></div>


    <div class="section">

        <h2>
            Управление
        </h2>

        <div class="actions" id="actions"></div>

    </div>


    <div class="section">

        <h2>
            Данные с сервера
        </h2>

        <div class="tabs">

            <button data-tab="events" class="active">
                События ключей
            </button>

            <button data-tab="logs">
                Логи службы
            </button>

            <span class="sp"></span>

            <button id="reloadOut">
                Загрузить
            </button>

        </div>

        <pre id="out">Нажмите «Загрузить», чтобы получить данные.</pre>

    </div>


    <div class="section">

        <h2>
            Журнал действий
        </h2>

        <ul class="log" id="log">

            <li>
                <span class="sub">Пока пусто</span>
            </li>

        </ul>

    </div>

</section>
