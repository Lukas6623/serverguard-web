<!-- ============================================================
     MODULE: TELEGRAM BOT
     ============================================================ -->

<section id="view-telegram" data-module="telegram" hidden>

    <header class="top">

        <div>

            <h1>
                Telegram Bot
            </h1>

            <div class="sub">
                Управление Telegram Bot и службой ServerGuard
            </div>

        </div>

        <div class="tools">

            <span class="spin" id="telegramSpin"></span>

            <label>

                <input type="checkbox" id="telegramAuto" checked>

                обновлять статус (15 с)

            </label>

            <button class="btn" id="telegramRefreshBtn" style="padding:6px 12px">
                Обновить
            </button>

        </div>

    </header>


    <div class="grid" id="telegramStats"></div>


    <div class="section">

        <h2>
            Информация
        </h2>

        <div class="info-grid" id="telegramInfo"></div>

    </div>


    <div class="section">

        <h2>
            Управление Telegram Bot
        </h2>

        <div class="actions" id="telegramActions"></div>

    </div>


    <div class="section">

        <h2>
            Логи Telegram
        </h2>

        <div class="tabs">

            <span class="sp"></span>

            <button id="telegramLogsBtn">
                Загрузить
            </button>

        </div>

        <pre id="telegramOut">Нажмите «Загрузить», чтобы получить логи Telegram Bot.</pre>

    </div>


    <div class="section">

        <h2>
            Журнал действий
        </h2>

        <ul class="log" id="telegramLog">

            <li>
                <span class="sub">Пока пусто</span>
            </li>

        </ul>

    </div>

</section>
