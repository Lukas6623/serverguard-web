<!-- ============================================================
     MODULE: SSH HARDENING
     ============================================================ -->

<section id="view-hardening" data-module="hardening" hidden>

    <header class="top">

        <div>

            <h1>
                SSH Hardening
            </h1>

            <div class="sub">
                Усиление и проверка конфигурации SSH-сервера
            </div>

        </div>

        <div class="tools">

            <span class="spin" id="hardeningSpin"></span>

            <label>

                <input type="checkbox" id="hardeningAuto" checked>

                обновлять статус (15 с)

            </label>

            <button class="btn" id="hardeningRefreshBtn" style="padding:6px 12px">
                Обновить
            </button>

        </div>

    </header>


    <div class="grid" id="hardeningStats"></div>


    <div class="section">

        <h2>
            Конфигурация
        </h2>

        <div class="info-grid" id="hardeningInfo"></div>

    </div>


    <div class="section">

        <h2>
            Параметры SSH
        </h2>

        <div class="hardening-grid" id="hardeningParameters"></div>

    </div>


    <div class="section">

        <h2>
            Управление
        </h2>

        <div class="actions" id="hardeningActions"></div>

    </div>


    <div class="section">

        <h2>
            Резервные копии
        </h2>

        <div class="tabs">

            <span class="sp"></span>

            <button id="hardeningBackupsBtn">
                Показать бэкапы
            </button>

        </div>

        <pre id="hardeningBackupsOut">Нажмите «Показать бэкапы», чтобы получить список.</pre>

    </div>


    <div class="section">

        <h2>
            Журнал действий
        </h2>

        <ul class="log" id="hardeningLog">

            <li>
                <span class="sub">Пока пусто</span>
            </li>

        </ul>

    </div>

</section>
